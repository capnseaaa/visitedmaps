<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visited Buildings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#d9ded9;
  --fill:#2f8f6b; --accent:#1f6f52; --err:#b3412f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121614; --panel:#1b211e; --fg:#e8ece9; --muted:#9aa49e; --line:#2c3430;
    --fill:#3fbf8f; --accent:#5fd3a6; --err:#e07a66; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
#map{flex:1;min-height:0}
.panel{background:var(--panel);border-top:1px solid var(--line);
  padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#status{font-size:13px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--err)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tools button{padding:6px 10px;font-size:13px}
.tools .count{margin-right:auto;font-variant-numeric:tabular-nums}
#list{max-height:30vh;overflow:auto;border-top:1px solid var(--line)}
#list[hidden]{display:none}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.item span{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.item button{padding:4px 10px;font-size:12px}
#importFile{display:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <form id="addForm" class="row">
    <input id="addr" type="text" placeholder="Paste address or 34.69, 135.19" autocomplete="off" aria-label="Address or coordinates">
    <button id="addBtn" class="primary" type="submit">Add</button>
  </form>
  <div id="status"></div>
  <div class="tools">
    <span class="count" id="count">0 buildings</span>
    <button id="listBtn" type="button">List</button>
    <button id="exportBtn" type="button">Export</button>
    <button id="importBtn" type="button">Import</button>
    <input id="importFile" type="file" accept="application/json,.json">
  </div>
  <div id="list" hidden></div>
</div>

<script>
const KEY = 'visited-buildings-v1';
const GAP_METERS = 1.5; // outlines this close count as touching

let entries = [];
try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { entries = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} }

const map = L.map('map', { zoomControl: false }).setView([34.6913, 135.1830], 15);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxNativeZoom: 18, maxZoom: 20,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a> · Buildings © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
}).addTo(map);

const css = getComputedStyle(document.documentElement);
const fillColor = css.getPropertyValue('--fill').trim() || '#2f8f6b';
let layer = null;

function render(fit){
  if (layer) { map.removeLayer(layer); layer = null; }
  document.getElementById('count').textContent = entries.length + (entries.length === 1 ? ' building' : ' buildings');
  renderList();
  if (!entries.length) return;
  let merged = null;
  for (const e of entries) {
    let f = turf.polygon(e.coords);
    try { f = turf.buffer(f, GAP_METERS, { units: 'meters' }) || f; } catch (err) {}
    try { merged = merged ? (turf.union(merged, f) || merged) : f; } catch (err) { /* skip a bad shape */ }
  }
  if (!merged) return;
  layer = L.geoJSON(merged, { style: { color: fillColor, weight: 1, fillColor: fillColor, fillOpacity: .55 } }).addTo(map);
  if (fit) map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 18 });
}

function renderList(){
  const box = document.getElementById('list');
  box.innerHTML = '';
  entries.slice().reverse().forEach(e => {
    const row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('span');
    t.textContent = e.label + ' ';
    const d = document.createElement('small'); d.textContent = e.date + (e.approx ? ' · no outline found' : '');
    t.appendChild(d);
    const go = document.createElement('button'); go.type = 'button'; go.textContent = 'Show';
    go.onclick = () => map.setView([e.lat, e.lng], 18);
    const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Remove';
    del.onclick = () => {
      if (del.dataset.armed) { entries = entries.filter(x => x.id !== e.id); save(); render(false); setStatus('Removed.'); }
      else { del.dataset.armed = '1'; del.textContent = 'Tap again'; }
    };
    row.append(t, go, del); box.appendChild(row);
  });
}

function setStatus(msg, isErr){
  const s = document.getElementById('status');
  s.textContent = msg; s.className = isErr ? 'err' : '';
}

function normalize(s){
  s = s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  s = s.replace(/[−－‐―]/g, '-');
  s = s.replace(/^日本[、,\s]*/, '');
  s = s.replace(/〒?\s*\d{3}-\d{4}\s*/, '');
  return s.trim();
}

async function geocode(text){
  const m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return { lat: +m[1], lng: +m[2], label: m[1] + ', ' + m[2] };
  const q = normalize(text);
  const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('The address lookup failed. Try coordinates instead.');
  const data = await r.json();
  if (!data.length) throw new Error('No match for that address. Try coordinates instead.');
  const [lng, lat] = data[0].geometry.coordinates;
  return { lat, lng, label: q };
}

async function findBuilding(lat, lng){
  const query = `[out:json][timeout:25];way["building"](around:30,${lat},${lng});out geom;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST', body: 'data=' + encodeURIComponent(query),
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  });
  if (!r.ok) throw new Error('The building lookup is busy. Wait a minute and try again.');
  const data = await r.json();
  const pt = turf.point([lng, lat]);
  let best = null, bestDist = Infinity;
  for (const w of data.elements || []) {
    if (!w.geometry || w.geometry.length < 4) continue;
    const ring = w.geometry.map(g => [g.lon, g.lat]);
    const a = ring[0], b = ring[ring.length - 1];
    if (a[0] !== b[0] || a[1] !== b[1]) ring.push(a);
    const poly = turf.polygon([ring]);
    if (turf.booleanPointInPolygon(pt, poly)) return { id: w.id, coords: [ring] };
    const d = turf.distance(pt, turf.centroid(poly), { units: 'meters' });
    if (d < bestDist) { bestDist = d; best = { id: w.id, coords: [ring] }; }
  }
  return best;
}

document.getElementById('addForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const input = document.getElementById('addr');
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('addBtn');
  btn.disabled = true; setStatus('Looking up…');
  try {
    const g = await geocode(text);
    setStatus('Finding the building…');
    const b = await findBuilding(g.lat, g.lng);
    if (b && entries.some(e => e.wayId === b.id)) { setStatus('That building is already on your map.'); map.setView([g.lat, g.lng], 18); return; }
    let coords, approx = false;
    if (b) coords = b.coords;
    else { coords = turf.circle([g.lng, g.lat], 6, { units: 'meters', steps: 16 }).geometry.coordinates; approx = true; }
    entries.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), wayId: b ? b.id : null,
      label: g.label, lat: g.lat, lng: g.lng, coords, approx, date: new Date().toISOString().slice(0, 10) });
    save(); render(false); map.setView([g.lat, g.lng], 18);
    input.value = '';
    setStatus(approx ? 'Added. No outline exists here, so it shows as a small circle.' : 'Added.');
  } catch (err) {
    setStatus(err.message || 'Something went wrong. Check your connection.', true);
  } finally { btn.disabled = false; }
});

document.getElementById('listBtn').onclick = () => { const l = document.getElementById('list'); l.hidden = !l.hidden; };
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(entries, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'visited-buildings-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setStatus('Backup saved.');
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error();
    const have = new Set(entries.map(e => e.id));
    let added = 0;
    for (const e of data) if (e && e.coords && !have.has(e.id)) { entries.push(e); added++; }
    save(); render(true); setStatus('Imported ' + added + ' buildings.');
  } catch (err) { setStatus('That file is not a valid backup.', true); }
  ev.target.value = '';
};

render(true);
</script>
</body>
</html>
