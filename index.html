<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visited Buildings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#d9ded9;
  --fill:#2f8f6b; --accent:#1f6f52; --err:#b3412f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121614; --panel:#1b211e; --fg:#e8ece9; --muted:#9aa49e; --line:#2c3430;
    --fill:#3fbf8f; --accent:#5fd3a6; --err:#e07a66; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
#map{flex:1;min-height:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.panel{background:var(--panel);border-top:1px solid var(--line);
  padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#status{font-size:13px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--err)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tools button{padding:6px 10px;font-size:13px}
.tools .count{margin-right:auto;font-variant-numeric:tabular-nums}
#list{max-height:30vh;overflow:auto;border-top:1px solid var(--line)}
#list[hidden]{display:none}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.item span{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.item button{padding:4px 10px;font-size:12px}
#importFile{display:none}
.pop{display:flex;flex-direction:column;gap:10px;min-width:200px;font:14px system-ui,-apple-system,sans-serif}
.pop-title{font-weight:600;overflow-wrap:anywhere}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px #111}
.swatch.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);-webkit-appearance:none;appearance:none}
.swatch.custom::-webkit-color-swatch-wrapper{padding:0}
.swatch.custom::-webkit-color-swatch{border:none;border-radius:50%;opacity:0}
.pop-del{color:#b3412f;background:#fff;border:1px solid #d9ded9;padding:8px 10px;border-radius:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <form id="addForm" class="row">
    <input id="addr" type="text" placeholder="Address, coordinates, Plus Code or Google link" autocomplete="off" aria-label="Address or coordinates">
    <button id="addBtn" class="primary" type="submit">Add</button>
  </form>
  <div id="status">Tip: long-press the map to add a building there.</div>
  <div class="tools">
    <span class="count" id="count">0 buildings</span>
    <button id="listBtn" type="button">List</button>
    <button id="exportBtn" type="button">Export</button>
    <button id="importBtn" type="button">Import</button>
    <input id="importFile" type="file" accept="application/json,.json">
  </div>
  <div id="list" hidden></div>
</div>

<script>
const KEY = 'visited-buildings-v1';
const GAP_METERS = 1.5; // outlines this close count as touching

let entries = [];
try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { entries = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} }

const map = L.map('map', { zoomControl: false }).setView([34.6913, 135.1830], 15);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxNativeZoom: 18, maxZoom: 20,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a> · Buildings © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
}).addTo(map);

const css = getComputedStyle(document.documentElement);
const fillColor = css.getPropertyValue('--fill').trim() || '#2f8f6b';
let layer = null;

function render(fit){
  if (layer) { map.removeLayer(layer); layer = null; }
  document.getElementById('count').textContent = entries.length + (entries.length === 1 ? ' building' : ' buildings');
  renderList();
  if (!entries.length) return;
  // Buildings that touch are merged, but only with others of the same colour.
  const groups = new Map();
  for (const e of entries) {
    const c = e.color || fillColor;
    let f = turf.polygon(e.coords);
    try { f = turf.buffer(f, GAP_METERS, { units: 'meters' }) || f; } catch (err) {}
    const prev = groups.get(c);
    try { groups.set(c, prev ? (turf.union(prev, f) || prev) : f); } catch (err) { /* skip a bad shape */ }
  }
  layer = L.featureGroup();
  for (const [c, shape] of groups)
    L.geoJSON(shape, { style: { color: c, weight: 1, fillColor: c, fillOpacity: .55 } }).addTo(layer);
  layer.addTo(map);
  if (fit && layer.getLayers().length) map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 18 });
}

// Tap a building to recolour or remove it.
const SWATCHES = ['#2f8f6b', '#2f6fd0', '#d0442f', '#e08a1e', '#e2c12b', '#8a4fc4', '#d0508f', '#6b7280'];
function entryAt(latlng){
  const pt = turf.point([latlng.lng, latlng.lat]);
  let best = null, bestArea = Infinity;
  for (const e of entries) {
    let poly;
    try { poly = turf.buffer(turf.polygon(e.coords), GAP_METERS, { units: 'meters' }); } catch (err) { continue; }
    if (poly && turf.booleanPointInPolygon(pt, poly)) {
      const a = turf.area(poly);
      if (a < bestArea) { bestArea = a; best = e; }
    }
  }
  return best;
}
let buildingPop = null;
function buildingPopup(e, latlng){
  const box = document.createElement('div'); box.className = 'pop';
  L.DomEvent.disableClickPropagation(box);
  const t = document.createElement('div'); t.className = 'pop-title'; t.textContent = e.label;
  const row = document.createElement('div'); row.className = 'swatches';
  const current = (e.color || fillColor).toLowerCase();
  const pick = c => { e.color = c === SWATCHES[0] ? undefined : c; save(); render(false); buildingPopup(e, latlng); };
  for (const c of SWATCHES) {
    const s = document.createElement('button'); s.type = 'button'; s.className = 'swatch';
    s.style.background = c; s.setAttribute('aria-label', 'Colour ' + c);
    if (c === current || (!e.color && c === SWATCHES[0])) s.classList.add('on');
    s.onclick = () => pick(c);
    row.appendChild(s);
  }
  const custom = document.createElement('input'); custom.type = 'color'; custom.className = 'swatch custom';
  custom.value = /^#[0-9a-f]{6}$/i.test(current) ? current : SWATCHES[0];
  custom.setAttribute('aria-label', 'Pick any colour');
  custom.onchange = () => pick(custom.value.toLowerCase());
  row.appendChild(custom);
  const del = document.createElement('button'); del.type = 'button'; del.className = 'pop-del'; del.textContent = 'Remove building';
  del.onclick = () => {
    if (del.dataset.armed) { entries = entries.filter(x => x.id !== e.id); save(); render(false); map.closePopup(); setStatus('Removed.'); }
    else { del.dataset.armed = '1'; del.textContent = 'Tap again to remove'; }
  };
  box.append(t, row, del);
  if (buildingPop && map.hasLayer(buildingPop)) buildingPop.setLatLng(latlng).setContent(box);
  else buildingPop = L.popup().setLatLng(latlng).setContent(box).openOn(map);
}
map.on('click', ev => { const e = entryAt(ev.latlng); if (e) buildingPopup(e, ev.latlng); });

function renderList(){
  const box = document.getElementById('list');
  box.innerHTML = '';
  entries.slice().reverse().forEach(e => {
    const row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('span');
    t.textContent = e.label + ' ';
    const d = document.createElement('small'); d.textContent = e.date + (e.approx ? ' · no outline found' : '');
    t.appendChild(d);
    const go = document.createElement('button'); go.type = 'button'; go.textContent = 'Show';
    go.onclick = () => map.setView([e.lat, e.lng], 18);
    const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Remove';
    del.onclick = () => {
      if (del.dataset.armed) { entries = entries.filter(x => x.id !== e.id); save(); render(false); setStatus('Removed.'); }
      else { del.dataset.armed = '1'; del.textContent = 'Tap again'; }
    };
    row.append(t, go, del); box.appendChild(row);
  });
}

function setStatus(msg, isErr){
  const s = document.getElementById('status');
  s.textContent = msg; s.className = isErr ? 'err' : '';
}

function normalize(s){
  s = s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  s = s.replace(/[−－‐―]/g, '-');
  s = s.replace(/^日本[、,\s]*/, '');
  s = s.replace(/〒?\s*\d{3}-\d{4}\s*/, '');
  return s.trim();
}

function validLatLng(lat, lng){ return isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180; }

// Google Maps links. Short links (maps.app.goo.gl) redirect on Google's side and cannot be read from a web page.
function parseGoogleLink(text){
  if (!/google\.[a-z.]+\/maps|maps\.google\.|goo\.gl/i.test(text)) return null;
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(text))
    throw new Error('Short Google links cannot be read. In Google Maps, copy the Plus Code instead, or long-press the building on this map.');
  let s = text; try { s = decodeURIComponent(text); } catch (e) {}
  const num = '(-?\\d{1,3}(?:\\.\\d+)?)';
  const pats = [
    new RegExp('!3d' + num + '!4d' + num),                                         // the pin itself
    new RegExp('[?&](?:q|query|ll|destination|daddr|center)=(?:loc:)?\\s*' + num + '\\s*,\\s*\\+?' + num),
    new RegExp('/maps/(?:search|place|dir)/(?:[^/]*/)?' + num + ',\\s*\\+?' + num),
    new RegExp('@' + num + ',' + num)                                               // map view centre
  ];
  for (const p of pats) {
    const m = s.match(p);
    if (m && validLatLng(+m[1], +m[2])) {
      const place = s.match(/\/maps\/place\/([^/@]+)/);
      let label = place && !/^-?\d/.test(place[1]) ? place[1].replace(/\+/g, ' ') : (+m[1]).toFixed(6) + ', ' + (+m[2]).toFixed(6);
      return { lat: +m[1], lng: +m[2], label };
    }
  }
  throw new Error('That Google link has no location in it. Copy the Plus Code instead.');
}

// Plus Codes (Open Location Code). Short codes like "MQV2+GW" are placed near a reference point.
const OLC = '23456789CFGHJMPQRVWX';
function olcDecode(code){
  code = code.replace('+', '').toUpperCase();
  let lat = -90, lng = -180, latSize = 400, lngSize = 400;
  for (let i = 0; i < Math.min(code.length, 10); i += 2) {
    latSize /= 20; lngSize /= 20;
    lat += OLC.indexOf(code[i]) * latSize; lng += OLC.indexOf(code[i + 1]) * lngSize;
  }
  for (let i = 10; i < code.length; i++) {
    const d = OLC.indexOf(code[i]);
    latSize /= 5; lngSize /= 4;
    lat += Math.floor(d / 4) * latSize; lng += (d % 4) * lngSize;
  }
  return { lat: Math.min(90, lat + latSize / 2), lng: lng + lngSize / 2 };
}
function olcPrefix(lat, lng, n){
  lat = Math.min(Math.max(lat, -90), 89.999999) + 90;
  lng = ((lng + 180) % 360 + 360) % 360;
  let s = '', res = 20;
  for (let i = 0; i < n; i += 2) {
    const a = Math.floor(lat / res), b = Math.floor(lng / res);
    s += OLC[a] + OLC[b]; lat -= a * res; lng -= b * res; res /= 20;
  }
  return s;
}
function olcRecover(code, refLat, refLng){
  const pad = 8 - code.indexOf('+');
  if (pad === 0) return olcDecode(code);
  const res = Math.pow(20, 2 - pad / 2), half = res / 2;
  const c = olcDecode(olcPrefix(refLat, refLng, pad) + code);
  let { lat, lng } = c;
  if (refLat + half < lat && lat - res >= -90) lat -= res;
  else if (refLat - half > lat && lat + res <= 90) lat += res;
  if (refLng + half < lng) lng -= res;
  else if (refLng - half > lng) lng += res;
  return { lat, lng: ((lng + 180) % 360 + 360) % 360 - 180 };
}
async function parsePlusCode(text){
  const m = text.match(/(?:^|[\s,])([23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,7})(?=$|[\s,])/i);
  if (!m) return null;
  const code = m[1].toUpperCase(), before = code.indexOf('+');
  if (before % 2 || (before === 8 && (OLC.indexOf(code[0]) > 8 || OLC.indexOf(code[1]) > 17))) return null;
  let ref = map.getCenter(), refNote = 'near the current map view';
  const rest = text.replace(m[1], '').replace(/^[\s,]+|[\s,]+$/g, '');
  if (before < 8 && /[぀-ヿ一-鿿]/.test(rest)) {     // Japanese place name after the code
    try {
      const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(normalize(rest)));
      const data = r.ok ? await r.json() : [];
      if (data.length) { const [x, y] = data[0].geometry.coordinates; ref = { lat: y, lng: x }; refNote = 'in ' + rest; }
    } catch (e) {}
  }
  const p = olcRecover(code, ref.lat, ref.lng);
  return { lat: p.lat, lng: p.lng, label: text.trim(), note: before < 8 ? refNote : '' };
}

async function geocode(text){
  const link = parseGoogleLink(text);
  if (link) return link;
  const m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return { lat: +m[1], lng: +m[2], label: m[1] + ', ' + m[2] };
  const pc = await parsePlusCode(text);
  if (pc) return pc;
  const loose = text.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (loose && validLatLng(+loose[1], +loose[2])) return { lat: +loose[1], lng: +loose[2], label: loose[1] + ', ' + loose[2] };
  const q = normalize(text);
  const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('The address lookup failed. Try coordinates instead.');
  const data = await r.json();
  if (!data.length) throw new Error('No match for that address. Try coordinates instead.');
  const [lng, lat] = data[0].geometry.coordinates;
  return { lat, lng, label: q };
}

async function findBuilding(lat, lng){
  const query = `[out:json][timeout:25];way["building"](around:30,${lat},${lng});out geom;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST', body: 'data=' + encodeURIComponent(query),
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  });
  if (!r.ok) throw new Error('The building lookup is busy. Wait a minute and try again.');
  const data = await r.json();
  const pt = turf.point([lng, lat]);
  let best = null, bestDist = Infinity;
  for (const w of data.elements || []) {
    if (!w.geometry || w.geometry.length < 4) continue;
    const ring = w.geometry.map(g => [g.lon, g.lat]);
    const a = ring[0], b = ring[ring.length - 1];
    if (a[0] !== b[0] || a[1] !== b[1]) ring.push(a);
    const poly = turf.polygon([ring]);
    if (turf.booleanPointInPolygon(pt, poly)) return { id: w.id, coords: [ring] };
    const d = turf.distance(pt, turf.centroid(poly), { units: 'meters' });
    if (d < bestDist) { bestDist = d; best = { id: w.id, coords: [ring] }; }
  }
  return best;
}

// Returns true when a new building was added.
async function addBuilding(g){
  setStatus('Finding the building…');
  const b = await findBuilding(g.lat, g.lng);
  if (b && entries.some(e => e.wayId === b.id)) { setStatus('That building is already on your map.'); map.setView([g.lat, g.lng], 18); return false; }
  let coords, approx = false;
  if (b) coords = b.coords;
  else { coords = turf.circle([g.lng, g.lat], 6, { units: 'meters', steps: 16 }).geometry.coordinates; approx = true; }
  entries.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), wayId: b ? b.id : null,
    label: g.label, lat: g.lat, lng: g.lng, coords, approx, date: new Date().toISOString().slice(0, 10) });
  save(); render(false); map.setView([g.lat, g.lng], 18);
  const note = g.note ? ' Plus Code placed ' + g.note + '.' : '';
  setStatus((approx ? 'Added. No outline exists here, so it shows as a small circle.' : 'Added.') + note);
  return true;
}

let busy = false;
async function runAdd(getPlace, onAdded){
  if (busy) return;
  busy = true;
  const btn = document.getElementById('addBtn');
  btn.disabled = true; setStatus('Looking up…');
  try {
    if (await addBuilding(await getPlace()) && onAdded) onAdded();
  } catch (err) {
    setStatus(err.message || 'Something went wrong. Check your connection.', true);
  } finally { btn.disabled = false; busy = false; }
}

document.getElementById('addForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const input = document.getElementById('addr');
  const text = input.value.trim();
  if (!text) return;
  runAdd(() => geocode(text), () => { input.value = ''; });
});

// Long-press (or right-click) the map to add the building there.
map.on('contextmenu', e => {
  const lat = +e.latlng.lat.toFixed(6), lng = +e.latlng.lng.toFixed(6);
  const box = document.createElement('div');
  const b = document.createElement('button'); b.type = 'button'; b.className = 'primary'; b.textContent = 'Add this building';
  b.onclick = () => { map.closePopup(); runAdd(async () => ({ lat, lng, label: lat + ', ' + lng })); };
  box.appendChild(b);
  L.popup({ closeButton: true }).setLatLng(e.latlng).setContent(box).openOn(map);
});

document.getElementById('listBtn').onclick = () => { const l = document.getElementById('list'); l.hidden = !l.hidden; };
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(entries, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'visited-buildings-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setStatus('Backup saved.');
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error();
    const have = new Set(entries.map(e => e.id));
    let added = 0;
    for (const e of data) if (e && e.coords && !have.has(e.id)) { entries.push(e); added++; }
    save(); render(true); setStatus('Imported ' + added + ' buildings.');
  } catch (err) { setStatus('That file is not a valid backup.', true); }
  ev.target.value = '';
};

render(true);
</script>
</body>
</html>
