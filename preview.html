<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Map Style Preview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="basemap.js"></script>
<style>
html,body{height:100%;margin:0;background:#f5f5f2}
#map{height:100%}
#zoom{position:absolute;left:10px;top:10px;z-index:1000;background:#fff;color:#111;padding:6px 10px;border-radius:8px;font:600 16px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-control-layers-expanded{font:15px system-ui}
</style>
</head>
<body>
<div id="map"></div>
<div id="zoom"></div>
<script>
const map = L.map('map', { maxZoom: 20 }).setView([34.6913, 135.1830], 16);
const english = addBasemap(map);
const pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
  { maxNativeZoom: 18, maxZoom: 20, attribution: '国土地理院' });
L.control.layers({ 'New: English (GSI shapes)': english, 'Old: GSI pale': pale }, null, { collapsed: false }).addTo(map);
const z = document.getElementById('zoom');
const show = () => { z.textContent = 'Zoom ' + map.getZoom(); };
map.on('zoomend', show); show();
</script>
</body>
</html>
